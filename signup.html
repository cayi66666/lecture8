<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户注册</title>
    <!-- 引入bcryptjs加密库 -->
    <script src="https://cdn.jsdelivr.net/npm/bcryptjs@2.4.3/dist/bcrypt.min.js"></script>
</head>
<body>
    <h2>用户注册</h2>
    <form>
        <div>
            <label>姓名：</label>
            <input type="text" id="signupName" placeholder="请输入姓名">
        </div>
        <div>
            <label>邮箱：</label>
            <input type="email" id="signupEmail" placeholder="请输入邮箱">
        </div>
        <div>
            <label>密码：</label>
            <input type="password" id="signupPwd" placeholder="请输入密码">
        </div>
        <div>
            <label>确认密码：</label>
            <input type="password" id="signupPwd2" placeholder="请再次输入密码">
        </div>
        <button type="button" onclick="signup()">立即注册</button>
    </form>
    <!-- 引入验证脚本 -->
    <script src="authentication.js"></script>
</body>
</html>
